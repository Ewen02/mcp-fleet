# Intégration et livraison continues.
#
#   check   lint, types, tests, build de tous les paquets (Turborepo)
#           + audit des dépendances de prod
#   image   image de paie-fr : build, test de fumée durci, puis publication
#           sur GHCR (main uniquement)
#   deploy  déploiement via ~/infra/scripts/deploy.sh
#           (main uniquement, et seulement si DEPLOY_ENABLED vaut "true")
#
# Configuration (Settings > Secrets and variables > Actions) : voir DEPLOY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Annuler les runs obsolètes uniquement sur les PR : sur main, un push ne
# doit jamais interrompre un déploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm est lu dans `packageManager` du package.json racine.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint lint:root typecheck test build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: img
        # ghcr.io refuse les majuscules, or github.repository garde la casse du compte.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/mcp-paie-fr" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVER=paie-fr
          # Le VPS est amd64 : une image arm64 y finirait en « exec format error ».
          platforms: linux/amd64
          load: true
          tags: mcp-paie-fr:ci
          cache-from: type=gha,scope=mcp-paie-fr
          cache-to: type=gha,mode=max,scope=mcp-paie-fr
          provenance: false

      - name: Smoke test, hardened like production
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --user 1001:1001 \
            -p 127.0.0.1:3000:3000 mcp-paie-fr:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
            sleep 1
          done
          scripts/smoke-test.sh http://127.0.0.1:3000 || { docker logs smoke; exit 1; }

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVER=paie-fr
          platforms: linux/amd64
          push: true
          # Tag = SHA complet (ce que deploy.sh attend et garde pour un rollback) + latest.
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          # Même cache que l'étape Build : aucune couche n'est reconstruite.
          cache-from: type=gha,scope=mcp-paie-fr
          provenance: false

  deploy:
    needs: image
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Un seul déploiement à la fois, jamais interrompu.
    concurrency:
      group: deploy-mcp-paie-fr
      cancel-in-progress: false
    steps:
      - name: Deploy key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the VPS
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        # La clé est contrainte par un command= côté serveur : le texte envoyé
        # n'est pas exécuté, deploy.sh le valide (regex + liste blanche des
        # projets de ce dépôt), tire l'image du SHA, attend « healthy » et
        # revient au tag précédent sinon. Son code de sortie fait échouer ce job.
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              "$TARGET" "deploy mcp-paie-fr ${{ github.sha }}"

      - name: Smoke test through HTTPS
        env:
          DOMAIN: mcp-paie-fr.${{ vars.MCP_BASE_DOMAIN || '137-74-175-232.sslip.io' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://$DOMAIN/health"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
