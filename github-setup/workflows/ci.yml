# Intégration continue + livraison continue.
#   PR        : qualité (lint, types, tests, build, audit) + build de l'image
#   main      : idem + publication de l'image sur GHCR + déploiement sur le VPS
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Annuler les runs obsolètes uniquement sur les PR : sur main, un push ne
# doit jamais interrompre un déploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm est lu dans `packageManager` du package.json racine.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo : chaque tâche dans l'ordre des dépendances (le kit avant les serveurs).
      - run: pnpm turbo run lint lint:root typecheck test build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/mcp-paie-fr
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Une image par serveur du monorepo, choisi au build.
          build-args: SERVER=paie-fr
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Déploiement activé seulement quand la variable de dépôt DEPLOY_ENABLED vaut "true"
  # et que les secrets VPS_* sont configurés (voir DEPLOY.md).
  deploy:
    needs: image
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Un seul déploiement à la fois, jamais interrompu.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull and restart on the VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          TAG: ${{ needs.image.outputs.tag }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/mcp-paie-fr' }}
        run: |
          # Le tag est écrit dans .env : un `docker compose up` manuel ultérieur garde la même version.
          ssh "$TARGET" "cd '$APP_DIR' \
            && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env \
            && docker compose pull \
            && docker compose up -d --wait --wait-timeout 60"
      - name: Smoke test through HTTPS
        env:
          DOMAIN: ${{ vars.MCP_DOMAIN }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://$DOMAIN/health"
