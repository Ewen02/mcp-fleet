version: 2
updates:
  # pnpm : le lockfile et le catalogue (pnpm-workspace.yaml) de tout le workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Montée de version volontaire uniquement (voir le workflow rules-watch).
      - dependency-name: modele-social
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Image de base épinglée par digest dans le Dockerfile (commun à tous les serveurs).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
