# Déploiement sur un VPS, derrière un reverse proxy (Caddy) qui gère HTTPS.
# Usage : cp .env.example .env && docker compose up -d
services:
  mcp-paie-fr:
    image: ${IMAGE:?set IMAGE in .env, e.g. ghcr.io/<github-user>/<repository>/mcp-paie-fr}:${IMAGE_TAG:-latest}
    container_name: mcp-paie-fr
    restart: unless-stopped
    # Écoute uniquement sur la boucle locale : seul Caddy (sur l'hôte) y accède.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      ALLOWED_HOSTS: ${MCP_DOMAIN:?set MCP_DOMAIN in .env}
      TRUST_PROXY: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Durcissement : le serveur n'écrit rien sur disque et n'a besoin d'aucun privilège.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
